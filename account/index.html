<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>YANG Haus จดบัญชี</title>
<style>
  :root{--navy:#1f3864;--bg:#f4f6fa;--line:#d9dee8;--ok:#1e8e3e;--warn:#b45309;--err:#c62828}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:#1a1a1a;font-size:16px}
  header{background:var(--navy);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
  header small{font-weight:400;opacity:.85;font-size:13px}
  main{padding:14px 16px 40px;max-width:560px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:14px 8px;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:10px}
  .seg button.on{border-color:var(--navy);background:#e8edf7;font-weight:700}
  .big{display:block;width:100%;padding:16px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:var(--navy);color:#fff;margin-top:10px}
  .big.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .big:disabled{opacity:.5}
  label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .chk{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-top:10px;font-size:16px}
  .chk input{width:22px;height:22px}
  .hint{font-size:13px;color:#666;margin-top:6px}
  .ai{font-size:13px;padding:8px 10px;border-radius:8px;background:#fff8e1;color:#7a5b00;margin-bottom:8px}
  .ai.good{background:#e8f5e9;color:#1b5e20}
  img.prev{width:100%;border-radius:10px;border:1px solid var(--line);max-height:260px;object-fit:contain;background:#fafafa}
  .msg{padding:12px;border-radius:10px;margin-top:10px;font-size:15px}
  .msg.ok{background:#e8f5e9;color:#1b5e20}.msg.err{background:#fdecea;color:var(--err)}
  .hide{display:none}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid #ccc;border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .sum{font-size:15px;line-height:1.7}
  .sum b{color:var(--navy)}
</style>
</head>
<body>
<header><span>🧾 จดบัญชี YANG Haus</span><small id="who"></small></header>
<main>

<!-- STEP 1: ประเภท + รูป -->
<section id="s1">
  <div class="card">
    <h2>1. รายการนี้คืออะไร</h2>
    <div class="seg">
      <button id="tExp" class="on" onclick="setType('exp')">💸 ค่าใช้จ่าย</button>
      <button id="tBuy" onclick="setType('buy')">🛞 ซื้อยาง/ล้อ (ต้นทุน)</button>
    </div>
    <div class="hint" id="tHint">ค่าแท็กซี่ Lalamove อุปกรณ์ ค่าโฆษณา บิลโทรศัพท์ ฯลฯ</div>
  </div>
  <div class="card">
    <h2>2. ถ่ายรูปใบเสร็จ / ใบกำกับภาษี</h2>
    <input id="cam" type="file" accept="image/*" capture="environment" class="hide" onchange="gotPhoto(this)">
    <input id="pick" type="file" accept="image/*" class="hide" onchange="gotPhoto(this)">
    <button class="big" onclick="cam.click()">📷 ถ่ายรูป</button>
    <button class="big alt" onclick="pick.click()">🖼 เลือกจากอัลบั้ม</button>
    <div class="hint">ถ่ายให้เห็นทั้งใบ ชัดๆ ตรงๆ จะอ่านตัวเลขได้แม่น</div>
  </div>
</section>

<!-- STEP 2: ฟอร์ม -->
<section id="s2" class="hide">
  <div class="card">
    <img id="prev" class="prev" alt="">
    <div id="aiBox" class="ai"><span class="spin"></span>AI กำลังอ่านใบเสร็จ…</div>
  </div>
  <div class="card">
    <h2>3. ตรวจแล้วแก้ได้เลย</h2>
    <div class="row">
      <div><label>วันที่ในใบเสร็จ</label><input id="fDate" type="date"></div>
      <div><label>ธุรกิจ</label><select id="fBiz"></select></div>
    </div>
    <label id="lVendor">ผู้ขาย / ร้าน</label><input id="fVendor" type="text" list="supList"><datalist id="supList"></datalist>
    <div class="row">
      <div><label>เลขที่ใบกำกับ/ใบเสร็จ</label><input id="fInv" type="text"></div>
      <div><label>เลขผู้เสียภาษีผู้ขาย</label><input id="fTax" type="text" inputmode="numeric" maxlength="13"></div>
    </div>
    <div id="gExp">
      <label>ประเภทค่าใช้จ่าย</label><select id="fCat" onchange="catChanged()"></select>
    </div>
    <label id="lItems">รายละเอียด</label><input id="fItems" type="text">
    <div class="row">
      <div><label>ยอดรวมที่จ่าย (บาท)</label><input id="fTotal" type="number" step="0.01" inputmode="decimal"></div>
      <div id="gQty" class="hide"><label>จำนวน (เส้น/วง)</label><input id="fQty" type="number" inputmode="numeric"></div>
    </div>
    <div class="chk"><input id="fVat" type="checkbox"><span>มีใบกำกับภาษี (เคลม VAT ซื้อได้) <span id="vatCalc" class="hint" style="display:inline"></span></span></div>
    <div id="vatNote" class="hint hide"></div>
    <div id="gBuy" class="hide">
      <label>ค่า Lalamove ไปรับของ (ถ้ามี)</label><input id="fShip" type="number" step="0.01" inputmode="decimal">
    </div>
    <label>อ้างอิงเลขออเดอร์ขาย (ถ้าซื้อให้ออเดอร์ไหน)</label><input id="fOrder" type="text" placeholder="เช่น 2609141234ABCD">
    <label>หมายเหตุ</label><input id="fNote" type="text">
    <button class="big" id="btnSave" onclick="save()">💾 บันทึกลงชีท</button>
    <button class="big alt" onclick="reset()">↩︎ ถ่ายใหม่</button>
    <div id="msg"></div>
  </div>
</section>

<!-- STEP 3: เสร็จ -->
<section id="s3" class="hide">
  <div class="card">
    <h2>✅ บันทึกแล้ว</h2>
    <div class="sum" id="sumBox"></div>
    <button class="big" onclick="reset()">📷 จดใบต่อไป</button>
    <button class="big alt" onclick="closeApp()">ปิด</button>
  </div>
</section>

</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = 'PUT_LIFF_ID_HERE';
const GAS_URL = 'PUT_APPS_SCRIPT_WEB_APP_URL_HERE';

let type = 'exp', imgB64 = '', imgMime = 'image/jpeg', profile = null, cfg = null, hasAI = true;
const $ = id => document.getElementById(id);

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    profile = await liff.getProfile();
    $('who').textContent = profile.displayName;
  } catch (e) { $('who').textContent = 'นอก LINE'; }
  try { cfg = JSON.parse(localStorage.getItem('yh_cfg') || 'null'); } catch (e) {}
  if (cfg) fillConfig();
  post({ action: 'config' }).then(c => { if (c.ok) { cfg = c; hasAI = c.hasAI; localStorage.setItem('yh_cfg', JSON.stringify(c)); fillConfig(); } });
  $('fDate').value = today();
}
function fillConfig() {
  fill($('fBiz'), cfg.business, 'YANG Haus');
  fill($('fCat'), cfg.categories, 'อื่นๆ');
  $('supList').innerHTML = (cfg.suppliers || []).map(s => `<option value="${s}">`).join('');
}
function fill(sel, arr, def) { const v = sel.value; sel.innerHTML = (arr || []).map(x => `<option>${x}</option>`).join(''); sel.value = (arr || []).includes(v) ? v : def; }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function setType(t) {
  type = t;
  $('tExp').classList.toggle('on', t === 'exp'); $('tBuy').classList.toggle('on', t === 'buy');
  $('tHint').textContent = t === 'buy' ? 'สินค้าที่ซื้อจากซัพพลายเออร์เพื่อขายต่อ (มีหรือไม่มีใบกำกับก็ได้)' : 'ค่าแท็กซี่ Lalamove อุปกรณ์ ค่าโฆษณา บิลโทรศัพท์ ฯลฯ';
  $('gExp').classList.toggle('hide', t === 'buy'); $('gBuy').classList.toggle('hide', t !== 'buy'); $('gQty').classList.toggle('hide', t !== 'buy');
  $('lVendor').textContent = t === 'buy' ? 'ซัพพลายเออร์' : 'ผู้ขาย / ร้าน';
  $('lItems').textContent = t === 'buy' ? 'สินค้า (รุ่น/ขนาด)' : 'รายละเอียด';
  if (t === 'buy') $('fBiz').value = 'YANG Haus';
}

async function gotPhoto(inp) {
  const f = inp.files[0]; if (!f) return;
  inp.value = '';
  const { b64, url } = await shrink(f, 1600, 0.85);
  imgB64 = b64; $('prev').src = url;
  $('s1').classList.add('hide'); $('s2').classList.remove('hide'); $('msg').innerHTML = ''; window.scrollTo(0, 0);
  $('aiBox').className = 'ai'; $('aiBox').innerHTML = '<span class="spin"></span>AI กำลังอ่านใบเสร็จ…';
  if (!hasAI) { $('aiBox').innerHTML = 'ยังไม่ได้ตั้งค่า AI — กรอกเองได้เลย'; return; }
  const r = await post({ action: 'read', image: imgB64, mime: imgMime });
  if (!r.ok || r.noai || !r.data) { $('aiBox').innerHTML = 'อ่านอัตโนมัติไม่ได้ กรอกเองได้เลย' + (r.error ? ' (' + r.error + ')' : ''); return; }
  const d = r.data;
  if (d.date) $('fDate').value = d.date;
  if (d.vendor) $('fVendor').value = d.vendor;
  if (d.invoice_no) $('fInv').value = d.invoice_no;
  if (d.tax_id) $('fTax').value = String(d.tax_id).replace(/\D/g, '');
  if (d.items) $('fItems').value = d.items;
  if (d.total) $('fTotal').value = Number(d.total).toFixed(2);
  $('fVat').checked = !!d.is_tax_invoice;
  if (d.is_goods && type !== 'buy') setType('buy');
  if (d.category && cfg && cfg.categories.includes(d.category)) $('fCat').value = d.category;
  catChanged(); vatCalc();
  $('aiBox').className = 'ai good';
  $('aiBox').textContent = 'AI อ่านให้แล้ว (' + Math.round((d.confidence || 0) * 100) + '%) — เช็คยอดกับใบจริงก่อนกดบันทึก';
}

function catChanged() {
  const c = $('fCat').value || '';
  const noClaim = /น้ำมัน/.test(c);
  $('vatNote').classList.toggle('hide', !noClaim);
  if (noClaim) { $('fVat').checked = false; $('vatNote').textContent = 'ค่าน้ำมัน: หักเป็นค่าใช้จ่ายได้ แต่เคลม VAT ไม่ได้ → ติ๊กออกให้แล้ว'; }
  vatCalc();
}
function vatCalc() {
  const t = Number($('fTotal').value) || 0;
  $('vatCalc').textContent = ($('fVat').checked && t) ? '→ VAT ' + (t - t / 1.07).toFixed(2) : '';
}
$('fTotal').addEventListener('input', vatCalc); $('fVat').addEventListener('change', vatCalc);

async function save(force) {
  const total = Number($('fTotal').value);
  if (!total) return show('ใส่ยอดรวมก่อนค่ะ', 'err');
  if (!$('fDate').value) return show('ใส่วันที่ก่อนค่ะ', 'err');
  $('btnSave').disabled = true; show('<span class="spin"></span>กำลังบันทึก + เก็บรูปลง Drive…', '');
  const body = {
    action: 'save', type, force: !!force, image: imgB64, mime: imgMime,
    date: $('fDate').value, business: $('fBiz').value, vendor: $('fVendor').value.trim(),
    invoiceNo: $('fInv').value.trim(), taxId: $('fTax').value.trim(), category: $('fCat').value,
    items: $('fItems').value.trim(), total, qty: $('fQty').value, hasVat: $('fVat').checked,
    shipIn: $('fShip').value, orderRef: $('fOrder').value.trim(), note: $('fNote').value.trim(),
    by: profile ? profile.displayName : ''
  };
  const r = await post(body);
  $('btnSave').disabled = false;
  if (r.dup) { if (confirm('เลขที่ ' + r.invoiceNo + ' เคยบันทึกแล้ว บันทึกซ้ำอีกใบไหม?')) return save(true); return show('ยกเลิก ไม่ได้บันทึก', 'err'); }
  if (!r.ok) return show('บันทึกไม่สำเร็จ: ' + (r.error || ''), 'err');
  const lines = [
    '🧾 จดบัญชีแล้ว → แท็บ ' + r.tab + ' แถว ' + r.row,
    body.date + ' · ' + (body.vendor || '-'),
    body.items,
    'ยอด ' + total.toFixed(2) + (body.hasVat ? ' (VAT ' + r.vat.toFixed(2) + ' เคลมได้)' : ' (ไม่มีใบกำกับ)'),
    body.invoiceNo ? 'เลขที่ ' + body.invoiceNo : '',
    r.photoUrl ? 'รูป: ' + r.photoUrl : ''
  ].filter(Boolean);
  $('sumBox').innerHTML = lines.map(l => l.replace(/^(.+?)( → .+)$/, '<b>$1</b>$2')).join('<br>');
  $('s2').classList.add('hide'); $('s3').classList.remove('hide'); window.scrollTo(0, 0);
  try { if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text: lines.join('\n') }]); } catch (e) {}
}

function show(html, cls) { $('msg').innerHTML = '<div class="msg ' + cls + '">' + html + '</div>'; }
function reset() {
  imgB64 = ''; ['fVendor', 'fInv', 'fTax', 'fItems', 'fTotal', 'fQty', 'fShip', 'fOrder', 'fNote'].forEach(i => $(i).value = '');
  $('fVat').checked = false; $('fDate').value = today(); $('vatCalc').textContent = ''; $('vatNote').classList.add('hide');
  $('s2').classList.add('hide'); $('s3').classList.add('hide'); $('s1').classList.remove('hide'); window.scrollTo(0, 0);
}
function closeApp() { try { liff.closeWindow(); } catch (e) { window.close(); } }

function shrink(file, maxW, q) {
  return new Promise(res => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', q); URL.revokeObjectURL(u);
      res({ b64: url.split(',')[1], url });
    };
    img.src = u;
  });
}
async function post(obj) {
  try {
    const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'เชื่อมต่อไม่ได้: ' + e }; }
}
init();
</script>
</body>
</html>

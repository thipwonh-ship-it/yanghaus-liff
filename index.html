<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YANG Haus ส่งของ</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  body{font-family:-apple-system,Sarabun,sans-serif;margin:0;padding:16px;background:#f4f4f4}
  h2{margin:0 0 12px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,select,textarea,button{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fff}
  textarea{min-height:80px}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photos img{width:90px;height:90px;object-fit:cover;border-radius:6px}
  button{background:#06c755;color:#fff;border:0;font-weight:700;margin-top:20px}
  button:disabled{background:#aaa}
  .small{font-size:13px;color:#666}
  #msg{margin-top:12px;font-weight:600}
  .scanbtn{background:#1a73e8;margin-top:8px}
  #scanner{display:none;margin-top:8px;border-radius:8px;overflow:hidden;background:#000}
  #scanner.on{display:block}
  .radio label{font-weight:400;margin:6px 0;display:flex;align-items:center;gap:8px;background:#fff;padding:10px;border:1px solid #ccc;border-radius:8px}
  .radio input{width:auto}
  .chip{display:inline-block;background:#e8f5e9;color:#1b5e20;padding:4px 10px;border-radius:14px;margin:4px 4px 0 0;font-size:14px}
</style>
</head>
<body>
<h2>📦 ส่งของที่สาขา</h2>
<div class="small" id="who">กำลังเชื่อม LINE…</div>
<div class="small" style="background:#fff;border-radius:8px;padding:10px;margin-top:10px;line-height:1.6">
<b>ขั้นตอน:</b> ① ถ่ายรูปสินค้าทีละชิ้น ให้เห็นใบปะหน้า (ระบบอ่านเลขให้เอง) → ② ตอบว่าขนส่งยิงรับหรือยัง → ③ ถ่ายรูปสุดท้าย 1 รูป → ④ บันทึก
</div>

<label>ขนส่ง</label>
<select id="carrier">
  <option>SPX</option><option>J&T</option><option>Flash</option><option>BEST</option><option value="อื่นๆ">อื่นๆ (ระบุ)</option>
</select>
<input id="carrierOther" placeholder="ชื่อขนส่ง" style="display:none;margin-top:8px">

<label>สาขา</label>
<input id="branch" placeholder="เช่น SPX บางนา">

<label>ถ่ายรูปสินค้าแต่ละชิ้นให้เห็นใบปะหน้าชัดเจน <span style="color:#d32f2f">*บังคับ</span></label>
<input type="file" id="photo1" accept="image/*" capture="environment" style="display:none">
<button type="button" class="scanbtn" onclick="document.getElementById('photo1').click()">📸 ถ่ายรูปสินค้า (กดซ้ำทุกชิ้น)</button>
<div class="photos" id="prev1"></div>
<div id="filescan" style="display:none"></div>
<div class="small" id="cnt1"></div>

<label>เลขพัสดุที่อ่านได้ <span class="small" id="trackCount"></span></label>
<div id="scanned"></div>
<textarea id="tracking" placeholder="ระบบจะใส่ให้จากรูป (พิมพ์เพิ่มได้ถ้าอ่านไม่ติด)"></textarea>
<button type="button" class="scanbtn" id="scanBtn" style="background:#607d8b;font-size:14px;padding:8px">📷 อ่านไม่ติด? สแกนบาร์โค้ดด้วยกล้อง</button>
<div id="scanner"></div>

<label>ขนส่งยิงรับแล้วหรือยัง? <span style="color:#d32f2f">*บังคับ</span></label>
<div class="radio">
  <label><input type="radio" name="scanned" value="yes"> ✅ ยิงรับแล้ว</label>
  <label><input type="radio" name="scanned" value="no"> ⏳ ยังไม่ยิง (ฝากไว้ที่สาขา)</label>
</div>

<div id="blockYes" style="display:none">
<label>ถ่ายสลิป/หน้าจอที่ขนส่งยิงรับของ <span style="color:#d32f2f">*บังคับ</span></label>
<input type="file" id="photo2" accept="image/*" capture="environment" style="display:none">
<button type="button" class="scanbtn" onclick="document.getElementById('photo2').click()">📸 ถ่ายสลิปยิงรับ (1 รูปพอ)</button>
<div class="photos" id="prev2"></div>
</div>

<div id="blockNo" style="display:none">
<label>ถ่ายรูปของทั้งหมดให้เห็นครบ <span id="needCount">…</span> ชิ้น <span style="color:#d32f2f">*บังคับ</span></label>
<input type="file" id="photo3" accept="image/*" capture="environment" style="display:none">
<button type="button" class="scanbtn" onclick="document.getElementById('photo3').click()">📸 ถ่ายรูปของทั้งหมด (1 รูปพอ)</button>
<div class="photos" id="prev3"></div>
<div class="radio"><label><input type="checkbox" id="confirmCount"> ✔ ยืนยันว่าในรูปเห็นครบ <span id="needCount2">…</span> ชิ้น</label></div>
<label>พนักงานที่รับฝาก (ชื่อ/ลักษณะ) <span style="color:#d32f2f">*บังคับ</span></label>
<input id="staff" placeholder="เช่น พี่ผู้ชายเสื้อส้ม ชื่อเอ">
</div>

<label>หมายเหตุ</label>
<input id="note" placeholder="(ถ้ามี)">

<div class="small" id="upstat"></div>
<div class="small" id="gps">📍 กำลังหาตำแหน่ง…</div>
<button id="send" disabled>บันทึก</button>
<div id="msg"></div>

<script>
// ===== ตั้งค่า (แก้ 2 บรรทัดนี้) =====
const LIFF_ID = '2012109669-jTtL2UEr';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkkLIG7UicPi3G9x189PN7qNsEyc50iS4p01DTmkUDXU9mu6iEcYtZNezPRa8Ycgcz/exec';
// ===================================

let profile = null, pos = null;

async function main(){
  await liff.init({liffId: LIFF_ID});
  if(!liff.isLoggedIn()){ liff.login(); return; }
  profile = await liff.getProfile();
  document.getElementById('who').textContent = 'ผู้ส่ง: ' + profile.displayName;
  navigator.geolocation.getCurrentPosition(p=>{
    pos = {lat:p.coords.latitude, lng:p.coords.longitude};
    document.getElementById('gps').textContent = `📍 ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`;
    document.getElementById('send').disabled = false;
  }, ()=>{
    document.getElementById('gps').textContent = '📍 ไม่ได้ตำแหน่ง (กรุณาอนุญาต Location)';
    document.getElementById('send').disabled = false;
  }, {enableHighAccuracy:true, timeout:10000});
}

// สะสมรูปทีละใบ (กดถ่ายเพิ่มได้เรื่อยๆ แตะรูปเพื่อลบ)
const files1=[], files2=[], files3=[];
function preview(inputId, boxId, arr, cntId){
  const box=document.getElementById(boxId);
  function render(){
    box.innerHTML='';
    arr.forEach((f,i)=>{ const img=document.createElement('img'); img.src=URL.createObjectURL(f);
      img.onclick=()=>{ if(confirm('ลบรูปนี้?')){ arr.splice(i,1); render(); } }; box.appendChild(img); });
    if(cntId) document.getElementById(cntId).textContent = arr.length ? `${arr.length} รูป` : '';
  }
  document.getElementById(inputId).addEventListener('change', async e=>{
    const picked=[...e.target.files]; e.target.value='';
    for(const f of picked){
      let code='';
      if(inputId==='photo1'){ code = await checkLabelPhoto(f); if(!code) continue; }
      f.group = inputId==='photo1' ? 'item' : 'receipt';
      f.label = code===true ? '' : code;
      f.upload = uploadNow(f); // อัปโหลดเบื้องหลังทันที
      arr.push(f);
    }
    render();
  });
}

// ตรวจรูปสินค้า: ต้องอ่านบาร์โค้ดใบปะหน้าจากรูปได้
let fileScanner=null;
async function checkLabelPhoto(file){
  const msg=document.getElementById('msg');
  msg.textContent='🔍 กำลังตรวจใบปะหน้าในรูป…';
  fileScanner = fileScanner || new Html5Qrcode('filescan');
  let code=null;
  try{ const r=await fileScanner.scanFileV2(file,false); code=(r.decodedText||'').trim(); }catch(_){}
  if(!code){
    msg.textContent='❌ ไม่เห็นบาร์โค้ดใบปะหน้าในรูป กรุณาถ่ายใหม่ให้ชัด (ถ้าแน่ใจว่าเห็นชัด กดยืนยันได้)';
    if(navigator.vibrate) navigator.vibrate([60,60,60]);
    return confirm('อ่านบาร์โค้ดจากรูปไม่ได้\nถ่ายใหม่ให้เห็นใบปะหน้าชัดเจน\n\nยืนยันใช้รูปนี้อยู่ดี?') ? true : false;
  }
  const list = ta.value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!list.includes(code)){
    // ยังไม่ได้สแกนเลขนี้ → เพิ่มให้เลยจากรูป
    addCode(code);
    msg.textContent='✅ อ่านใบปะหน้าได้ '+code+' (เพิ่มเลขให้แล้ว)';
  } else {
    msg.textContent='✅ ใบปะหน้าชัด ตรงกับ '+code;
  }
  return code;
}

// อัปโหลดรูป 1 ใบไป Drive ทันที คืน URL
let pendingUploads=0;
function upStatus(){ const el=document.getElementById('upstat'); el.textContent = pendingUploads>0 ? `⬆️ กำลังอัปโหลดรูป ${pendingUploads} รูป…` : ''; }
async function uploadNow(f){
  pendingUploads++; upStatus();
  try{
    const data = await shrink(f);
    const r = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'upload', group:f.group, label:f.label||'', carrier:document.getElementById('carrier').value, data})});
    const j = await r.json(); if(!j.ok) throw new Error(j.error);
    return j.url;
  }catch(e){ f.failed=true; return null; }
  finally{ pendingUploads--; upStatus(); }
}
preview('photo1','prev1',files1,'cnt1'); preview('photo2','prev2',files2); preview('photo3','prev3',files3);
document.querySelectorAll('input[name=scanned]').forEach(r=>r.addEventListener('change',e=>{
  document.getElementById('blockYes').style.display = e.target.value==='yes'?'block':'none';
  document.getElementById('blockNo').style.display  = e.target.value==='no' ?'block':'none';
}));
document.getElementById('carrier').addEventListener('change', e=>{
  document.getElementById('carrierOther').style.display = e.target.value==='อื่นๆ' ? 'block' : 'none';
});

// ===== สแกนบาร์โค้ด =====
let scanner = null, scanning = false, lastCode = '', lastTime = 0;
const ta = document.getElementById('tracking');
function addCode(code){
  code = code.trim();
  const list = ta.value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(list.includes(code)){ document.getElementById('msg').textContent='⚠️ เลข '+code+' สแกนไปแล้ว'; if(navigator.vibrate) navigator.vibrate([60,60,60]); return; }
  document.getElementById('msg').textContent='';
  list.push(code); ta.value = list.join('\n');
  const chip=document.createElement('span'); chip.className='chip'; chip.textContent='✔ '+code;
  document.getElementById('scanned').appendChild(chip);
  if(navigator.vibrate) navigator.vibrate(80);
  updateCounts();
}
function updateCounts(){
  const n = ta.value.split(/\n/).map(s=>s.trim()).filter(Boolean).length;
  document.getElementById('trackCount').textContent = n ? `(${n} ชิ้น)` : '';
  document.getElementById('needCount').textContent = n || '…';
  document.getElementById('needCount2').textContent = n || '…';
}
ta.addEventListener('input', updateCounts);
document.getElementById('scanBtn').onclick = async ()=>{
  const btn=document.getElementById('scanBtn'), box=document.getElementById('scanner');
  if(scanning){ await scanner.stop(); box.classList.remove('on'); btn.textContent='📷 อ่านไม่ติด? สแกนบาร์โค้ดด้วยกล้อง'; scanning=false; return; }
  scanner = scanner || new Html5Qrcode('scanner');
  box.classList.add('on'); btn.textContent='⏹ หยุดสแกน'; scanning=true;
  try{
    await scanner.start({facingMode:'environment'},
      {fps:10, qrbox:{width:280,height:120}, formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE]},
      (text)=>{
        const now=Date.now();
        if(text===lastCode && now-lastTime<2000) return;
        lastCode=text; lastTime=now; addCode(text);
      }, ()=>{});
  }catch(e){ document.getElementById('msg').textContent='❌ เปิดกล้องไม่ได้: '+e; box.classList.remove('on'); btn.textContent='📷 อ่านไม่ติด? สแกนบาร์โค้ดด้วยกล้อง'; scanning=false; }
};

// ย่อรูปก่อนส่ง (กว้างสุด 1280px)
function shrink(file){
  return new Promise(res=>{
    const img=new Image(); img.onload=()=>{
      const s=Math.min(1,1024/img.width); const c=document.createElement('canvas');
      c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7).split(',')[1]);
    }; img.src=URL.createObjectURL(file);
  });
}

document.getElementById('send').onclick = async ()=>{
  const btn=document.getElementById('send'), msg=document.getElementById('msg');
  const f1=files1, f2=files2;
  const tracking=document.getElementById('tracking').value.trim();
  const nTrack=tracking.split(/\n/).map(s=>s.trim()).filter(Boolean).length;
  let carrier=document.getElementById('carrier').value;
  if(carrier==='อื่นๆ'){ carrier=document.getElementById('carrierOther').value.trim(); if(!carrier){ msg.textContent='⚠️ ระบุชื่อขนส่ง'; return; } }
  if(!tracking){ msg.textContent='⚠️ ต้องใส่เลขพัสดุ (สแกนหรือพิมพ์)'; return; }
  if(!f1.length){ msg.textContent='⚠️ ต้องถ่ายรูปของวางที่สาขา (เห็นใบปะหน้า)'; return; }
  if(f1.length!==nTrack && !confirm(`เลขพัสดุ ${nTrack} ชิ้น แต่รูปสินค้า ${f1.length} รูป\nควรถ่าย 1 ชิ้น 1 รูป — ส่งต่อเลยไหม?`)) return;
  const scannedEl=document.querySelector('input[name=scanned]:checked');
  if(!scannedEl){ msg.textContent='⚠️ เลือกว่าขนส่งยิงรับแล้วหรือยัง'; return; }
  const scanned=scannedEl.value==='yes';
  const staff=document.getElementById('staff').value.trim();
  if(scanned && !f2.length){ msg.textContent='⚠️ ต้องถ่ายรูปใบรับฝาก/หน้าจอสแกนของขนส่ง'; return; }
  if(!scanned && !files3.length){ msg.textContent='⚠️ ต้องถ่ายรูปของวางที่เคาน์เตอร์'; return; }
  if(!scanned && !staff){ msg.textContent='⚠️ ระบุพนักงานที่รับฝาก'; return; }
  if(!scanned && !document.getElementById('confirmCount').checked){ msg.textContent=`⚠️ ติ๊กยืนยันว่ารูปเห็นครบ ${nTrack} ชิ้น`; return; }
  if(scanning){ try{ await scanner.stop(); }catch(_){} document.getElementById('scanner').classList.remove('on'); scanning=false; }
  btn.disabled=true; msg.textContent='⏳ กำลังส่ง…';
  // รอรูปที่อัปโหลดค้าง (ปกติเสร็จแล้ว) รูปที่ล้มเหลวส่งซ้ำ
  const finalFiles = scanned?f2:files3;
  const getUrl = async f => { let u = await f.upload; if(!u){ f.upload = uploadNow(f); u = await f.upload; } return u; };
  const itemLinks = await Promise.all(f1.map(getUrl));
  const receiptLinks = await Promise.all(finalFiles.map(getUrl));
  if(itemLinks.includes(null)||receiptLinks.includes(null)){ msg.textContent='❌ อัปโหลดรูปไม่สำเร็จ ลองกดบันทึกอีกครั้ง'; btn.disabled=false; return; }
  const body={name:profile.displayName, userId:profile.userId,
    carrier, branch:document.getElementById('branch').value,
    tracking, scanned, staff, note:document.getElementById('note').value, lat:pos?.lat, lng:pos?.lng, itemLinks, receiptLinks};
  try{
    const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(body)});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error);
    msg.textContent=`✅ บันทึกแล้ว ${j.time} (${j.count} ชิ้น)`;
    if(liff.isInClient()){
      await liff.sendMessages([{type:'text',text:`${scanned?'📦 ส่งของแล้ว ✅ ยิงรับแล้ว':'📦 ส่งของแล้ว ⏳ ยังไม่ยิงรับ รอตรวจสอบ'} ${j.time}\n${body.carrier} ${body.branch}${scanned?'':'\nรับฝาก: '+staff}\n${j.count} ชิ้น\n${tracking}\n${pos?`📍 https://maps.google.com/?q=${pos.lat},${pos.lng}`:''}`}]).catch(()=>{});
      setTimeout(()=>liff.closeWindow(),1500);
    }
  }catch(e){ msg.textContent='❌ ส่งไม่สำเร็จ: '+e.message; btn.disabled=false; }
};
main();
</script>
</body>
</html>

<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:700;src:url(fonts/Prompt_700Bold.ttf)}
@font-face{font-family:P;font-weight:500;src:url(fonts/Prompt_500Medium.ttf)}
*{box-sizing:border-box;margin:0}
body{width:2500px;height:843px;background:#fcf9e6;font-family:P;position:relative;overflow:hidden}
.tread{position:absolute;inset:0;opacity:.11}
.band{position:absolute;left:0;top:0;width:2500px;height:170px;display:flex;align-items:center;gap:28px;padding:0 60px}
.band img{height:130px;}
.band .w{font-weight:700;font-size:74px;letter-spacing:2px;color:#1f663a}
.band .w span{color:#88a577}
.band .s{font-weight:500;font-size:46px;color:#347442;margin-left:auto}
.row{position:absolute;left:0;top:170px;width:2500px;height:673px;display:flex}
.cell{width:833.33px;height:100%;padding:8px 22px 40px}
.cell:first-child{padding-left:44px}.cell:last-child{padding-right:44px}
.btn{height:100%;border-radius:56px;background:#f7efc4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;border:7px solid #347442}
.btn.new{background:#fffff5}
.btn svg{width:250px;height:250px}
.t{font-weight:700;font-size:112px;line-height:1.15;color:#1f663a}
.d{font-weight:500;font-size:50px;color:#5d7f55}
.new .t{color:#1f663a}.new .d{color:#347442}
</style>
